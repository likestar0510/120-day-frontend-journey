<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #ccc;
    }

    .cart {
      height: 300px;
      width: 234px;
      background-color: #fff;
      margin: 100px auto;
      text-align: center;
      transition: all .3s;
    }

    .cart img {
      width: 160px;
      margin-top: 20px;
    }

    .cart h3 {
      font-size: 14px;
      font-weight: normal;
      color: #333;
      margin-top: 18px;
    }

    .cart .desc {
      font-size: 12px;
      color: #b0b0b0;
      margin-bottom: 10px;
      padding: 0 10px;
      /* 强制文字一行显示，显示不完就省略号 */
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cart .price {
      font-size: 14px;
      color: #b0b0b0;
    }

    .cart .price .surprise {
      color: #ff6700;
    }

    .cart:hover {
      box-shadow: 0 15px 30px rgba(0, 0, 0, .1);
    }
  </style>
</head>

<body>
  <div class="cart">
    <img src="./images/mi.webp">
    <h3>Xiaomi Buds 5</h3>
    <p class="desc">
      舒适无感佩戴 | 高通全链路无损音频 | 哈曼 AudioEFX 联合调音
    </p>
    <p class="price">
      <span class="surprise">
        659元
      </span>
      <del>
        699元
      </del>
    </p>
  </div>
</body>

</html>
