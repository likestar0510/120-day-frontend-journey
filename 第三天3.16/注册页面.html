<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>世纪佳缘，你在我也在</title>
</head>

<body>
    <h4>青春不常在，抓紧谈恋爱</h4>
    <table width="500">
        <tr>
            <!-- 第一行 -->
            <td>性别</td>
            <td>
                <input type="radio" name="sex" value="nan" id="sex1" /><label for="sex1"><img src="images/man.jpg">
                    男</label>
                <input type="radio" name="sex" value="nv" id="sex" /><label for="sex"><img src="images/women.jpg">
                    女</label>
            </td>
        </tr>
        <tr>
            <!-- 第二行 -->
            <td>生日</td>
            <td>
                <select>
                    <option>--请选择年--</option>
                    <option>1988</option>
                    <option>1989</option>
                    <option>1990</option>
                    <option>1991</option>
                    <option>1992</option>
                </select>
                <select>
                    <option>--请选择月--</option>
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                    <option>5</option>
                    <option>6</option>
                    <option>7</option>
                    <option>8</option>
                    <option>9</option>
                    <option>10</option>
                    <option>11</option>
                    <option>12</option>
                </select>
                <select>
                    <option>--请选择日--</option>
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                    <option>5</option>
                </select>
            </td>
        </tr>
        <tr>
            <!-- 第三行 -->
            <td>
                所在地区
            </td>
            <td>
                <input type="text">
            </td>
        </tr>
        <tr>
            <!-- 第四行 -->
            <td>
                婚姻状况
            </td>
            <td>
                <input type="radio" name="marry" id="weihun" /><label for="weihun">未婚</label>
                <input type="radio" name="marry" id="yihun" /><label for="yihun">已婚</label>
                <input type="radio" name="marry" id="liyi" /><label for="liyi">离异</label>
            </td>
        </tr>
        <tr>
            <!-- 第五行 -->
            <td>
                学历
            </td>
            <td>
                <input type="text" />
            </td>
        </tr>
        <tr>
            <!-- 第六行 -->
            <td>
                喜欢的类型
            </td>
            <td>
                <input type="checkbox" name="style" id="w" /><label for="w">妩媚的</label>
                <input type="checkbox" name="style" id="k" /><label for="k">可爱的</label>
                <input type="checkbox" name="style" id="x" /><label for="x">小鲜肉</label>
                <input type="checkbox" name="style" id="l" /><label for="l">老腊肉</label>
                <input type="checkbox" name="style" id="d" /><label for="d">都喜欢</label>
            </td>
        </tr>
        <tr>
            <!-- 第七行 -->
            <td>
                自我介绍
            </td>
            <td>
                <textarea>自我介绍</textarea>
            </td>
        </tr>
        <tr>
            <!-- 第八行 -->
            <td></td>
            <td>
                <input type="button" value="免费注册"></input>
            </td>
        </tr>
        <tr>
            <!-- 第九行 -->
            <td></td>
            <td>
                <input type="checkbox" checked="checked" />我同意注册条款和会员加入标准
            </td>
        </tr>
        <tr>
            <td></td>
            <td>
                <a href="#">我是会员，立即登录</a>
            </td>
        </tr>
        <tr>
            <td></td>
            <td>
                <h2>我承诺</h2>
                <ul>
                    <li>年满18岁，单身</li>
                    <li>抱着严肃的态度</li>
                    <li>真诚寻找另一半</li>
                </ul>

            </td>
        </tr>


    </table>

</body>

</html>
